[unix_http_server]
file=/Volumes/Workspace/Servers/media-transcribe/data/supervisor.sock
chmod=0700

[supervisord]
logfile=/Volumes/Workspace/Servers/media-transcribe/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/Volumes/Workspace/Servers/media-transcribe/data/supervisord.pid
childlogdir=/Volumes/Workspace/Servers/media-transcribe/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///Volumes/Workspace/Servers/media-transcribe/data/supervisor.sock

[program:api]
directory=/Volumes/Workspace/Servers/media-transcribe
command=/Volumes/Workspace/Servers/media-transcribe/.venv/bin/python -m uvicorn backend.api:app --host 0.0.0.0 --port 3401 --no-access-log --timeout-graceful-shutdown 5
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1",TZ="Asia/Shanghai"
stdout_logfile=/Volumes/Workspace/Servers/media-transcribe/logs/api.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[program:worker]
directory=/Volumes/Workspace/Servers/media-transcribe
command=/Volumes/Workspace/Servers/media-transcribe/.venv/bin/python -m backend.worker
autostart=true
autorestart=true
startsecs=3
startretries=10
stopwaitsecs=60
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1",OMP_NUM_THREADS="8",TZ="Asia/Shanghai",HF_HUB_OFFLINE="1",MODELSCOPE_OFFLINE="1"
stdout_logfile=/Volumes/Workspace/Servers/media-transcribe/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true
